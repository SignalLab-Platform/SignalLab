name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore backend
        run: dotnet restore apps/api/SignalLab.Api.sln

      - name: Build backend
        run: >
          dotnet build
          apps/api/SignalLab.Api.sln
          --configuration Release
          --no-restore

      - name: Test backend
        run: >
          dotnet test
          apps/api/SignalLab.Api.sln
          --configuration Release
          --no-build
          --no-restore

      - name: Build backend Docker image
        run: >
          docker build
          --file apps/api/Dockerfile
          --tag signallab-api:ci
          apps/api

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck frontend
        working-directory: apps/web
        run: npm run typecheck

      - name: Test frontend
        working-directory: apps/web
        run: npm test

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Build frontend Docker image
        run: >
          docker build
          --file apps/web/Dockerfile
          --tag signallab-web:ci
          apps/web